<head>
<meta charset="UTF-8">

<title>Vishal — ACCA FA2</title>
<style>
  :root{
    --bg:#FFFFFF;
    --row-top:#FFFFFF;
    --row-bot:#F5F4F2;
    --row-text:#111114;
    --icon-border:#8A8A90;
    --icon-color:#6C6C72;
    --chevron:#8A8A90;
    --tabbar-bg:#EFEDEA;
    --tab-active-bg:#151417;
    --tab-active-text:#FFFFFF;
    --tab-inactive-text:#3A3A3E;
    --sub-line:rgba(0,0,0,0.08);
    --shadow:0 3px 10px rgba(20,20,22,0.12);
    --play-red:#E5342B;
    --doc-blue:#3B78D8;
    --progress-track:#E7E5E1;
    --progress-start:#E7B93B;
    --progress-end:#4CAF50;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:18px 14px 60px;
  }

  /* ---------- course picker (simple entry point) ---------- */
  #shelfScreen{
    max-width:640px;
    margin:0 auto;
    padding:40px 6px;
  }
  #shelfScreen.hidden{ display:none; }
  .shelf-title{
    color:#111114;
    font-size:22px;
    font-weight:700;
    margin:0 0 4px;
  }
  .shelf-sub{
    color:#6C6C72;
    font-size:14px;
    margin:0 0 26px;
  }
  .course-btn{
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg,var(--row-top),var(--row-bot));
    border:none;
    border-radius:16px;
    padding:20px 22px;
    cursor:pointer;
    box-shadow:var(--shadow);
    border:1px solid rgba(20,20,22,0.06);
    font-family:inherit;
  }
  .course-btn-left{ display:flex; flex-direction:column; gap:3px; }
  .course-code{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--icon-color);
  }
  .course-name{
    font-size:16px;
    font-weight:700;
    color:var(--row-text);
  }
  .course-arrow{ color:var(--chevron); font-size:18px; }

  /* ---------- course screen ---------- */
  #courseScreen{ max-width:640px; margin:0 auto; }
  #courseScreen.hidden{ display:none; }

  .back-row{
    display:flex;
    align-items:center;
    gap:6px;
    color:#7A7A80;
    font-size:13px;
    font-weight:600;
    padding:2px 6px 14px;
    cursor:pointer;
    width:fit-content;
  }
  .back-row:hover{ color:#111114; }

  .tabbar{
    background:var(--tabbar-bg);
    border-radius:22px;
    padding:6px;
    display:flex;
    gap:4px;
    align-items:center;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(20,20,22,0.06);
    flex-wrap:nowrap;
    overflow-x:auto;
  }
  .tab-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    border:none;
    background:none;
    padding:11px 16px;
    border-radius:16px;
    cursor:pointer;
    color:var(--tab-inactive-text);
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab-btn.active{
    background:var(--tab-active-bg);
    color:var(--tab-active-text);
  }

  .topic-list{ display:flex; flex-direction:column; gap:14px; }

  .topic{
    background:linear-gradient(180deg,var(--row-top),var(--row-bot));
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(20,20,22,0.06);
    overflow:hidden;
  }
  .topic-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:19px 20px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
  }
  .plus-icon{
    width:26px;height:26px;
    border-radius:50%;
    border:1.6px solid var(--icon-border);
    color:var(--icon-color);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    transition:transform .2s ease;
  }
  .plus-icon::before, .plus-icon::after{
    content:"";
    position:absolute;
    background:var(--icon-color);
  }
  .plus-icon::before{ width:11px; height:1.6px; }
  .plus-icon::after{ width:1.6px; height:11px; }
  .topic.open .plus-icon{ transform:rotate(135deg); }

  .topic-name{
    flex:1;
    font-size:15px;
    font-weight:700;
    color:var(--row-text);
  }
  .chevron{
    width:16px;height:16px;
    flex-shrink:0;
    color:var(--chevron);
    transition:transform .2s ease;
  }
  .topic.open .chevron{ transform:rotate(180deg); }

  .topic-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .lecture-list{
    list-style:none;
    margin:0;
    padding:0 20px 18px 20px;
  }
  .lecture-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-top:1px solid var(--sub-line);
    font-size:13.5px;
  }
  .lecture-list li.clickable{
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .lecture-list li.clickable:hover,
  .lecture-list li.clickable:active{
    background:rgba(0,0,0,0.035);
  }
  .lecture-icon{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lecture-icon svg{ width:100%; height:100%; display:block; }
  .lecture-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .lecture-title{
    color:#2B2B2E;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lecture-dur{ color:#6C6C72; font-size:11.5px; }
  .lecture-sub{ color:#9A9AA0; font-size:11.5px; }
  .lecture-progress{
    flex-shrink:0;
    width:76px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .progress-track{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--progress-track);
    overflow:hidden;
  }
  .progress-fill{
    display:block;
    height:100%;
    border-radius:3px;
    background:linear-gradient(90deg,var(--progress-start),var(--progress-end));
  }
  .progress-pct{
    font-size:10.5px;
    font-weight:600;
    color:#8A8A90;
    width:30px;
    text-align:right;
    flex-shrink:0;
  }

  .empty-tab{
    padding:50px 20px;
    text-align:center;
    color:#8A8A90;
    font-size:13.5px;
    background:linear-gradient(180deg,var(--row-top),var(--row-bot));
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(20,20,22,0.06);
  }

  .site-footer{
    max-width:640px;
    margin:36px auto 0;
    padding:22px 6px 4px;
    text-align:center;
  }
  .site-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    color:#111114;
    margin:0 0 4px;
  }
  .good-luck{
    font-size:13px;
    color:#8A8A90;
    margin:0;
  }
</style>

                  <path d="M7 3.5h10l4 4v17a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-20a1 1 0 0 1 1-1z" fill="none" stroke="var(--doc-blue)" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M17 3.5v4h4" fill="none" stroke="var(--doc-blue)" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M9.5 14h9M9.5 17.5h9M9.5 10.5h5" stroke="var(--doc-blue)" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="lecture-info">
                <span class="lecture-title">${m.title}</span>
                <span class="lecture-sub">Study Material</span>
              </span>
            </li>`).join('')}
        </ul>
      </div>
    `;
    const head = wrap.querySelector('.topic-head');
    const body = wrap.querySelector('.topic-body');
    head.addEventListener('click', () => {
      const isOpen = wrap.classList.toggle('open');
      head.setAttribute('aria-expanded', isOpen);
      body.style.maxHeight = isOpen ? body.scrollHeight + 'px' : 0;
    });
    panel.appendChild(wrap);
    });
  }

  renderTopicList(document.getElementById('panel-lectures'), topics);
  renderTopicList(document.getElementById('panel-attachments'), attachments);

  // ---- screen navigation ----
  const shelfScreen = document.getElementById('shelfScreen');
  const courseScreen = document.getElementById('courseScreen');
  const backLink = document.getElementById('backLink');

  document.getElementById('fa2Card').addEventListener('click', () => {
    shelfScreen.classList.add('hidden');
    courseScreen.classList.remove('hidden');
    window.scrollTo(0,0);
  });

  backLink.addEventListener('click', () => {
    courseScreen.classList.add('hidden');
    shelfScreen.classList.remove('hidden');
    window.scrollTo(0,0);
  });

  // ---- tabs ----
  const tabButtons = document.querySelectorAll('.tab-btn');
  const panels = {
    lectures: document.getElementById('panel-lectures'),
    attachments: document.getElementById('panel-attachments'),
    sessions: document.getElementById('panel-sessions'),
  };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(panels).forEach(([key, el]) => {
        el.style.display = key === btn.dataset.tab ? 'flex' : 'none';
      });
    });
  });
</script>
</body>
</html>
