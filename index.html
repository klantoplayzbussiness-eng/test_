<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCA FA2 — Course Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF6E1F;
    --orange-deep:#E85A0C;
    --orange-light:#FFB27A;
    --orange-tint:#FFF1E6;
    --bg:#FFFFFF;
    --card-bg:#FFFFFF;
    --text-dark:#2B2016;
    --text-muted:#8A7A6D;
    --text-faint:#B8A99C;
    --sub-line:#F3E4D6;
    --shadow-3d:0 6px 0 rgba(232,90,12,0.18), 0 10px 20px rgba(232,90,12,0.10);
    --shadow-3d-sm:0 4px 0 rgba(232,90,12,0.16), 0 6px 14px rgba(232,90,12,0.08);
    --shadow-3d-dark:0 6px 0 rgba(0,0,0,0.18), 0 12px 24px rgba(232,90,12,0.20);
    --play-red:#E5342B;
    --doc-blue:#2B6CB0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    min-height:100vh;
    font-family:'Poppins','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 50px;
    color:var(--text-dark);
  }

  /* ---------- top brand strip ---------- */
  .brand-strip{
    background:#FFFFFF;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:2px solid var(--orange-tint);
  }
  .brand-mark{
    width:36px; height:36px;
    border-radius:14px;
    background:linear-gradient(145deg,var(--orange-light),var(--orange));
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:15px;
    color:#FFFFFF;
    flex-shrink:0;
    box-shadow:0 4px 0 var(--orange-deep);
  }
  .brand-text{
    color:var(--text-dark);
    font-size:14px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .brand-text small{
    display:block;
    font-size:10.5px;
    font-weight:600;
    color:var(--orange);
    letter-spacing:.06em;
    margin-top:1px;
  }

  /* ---------- course picker (hero-style entry) ---------- */
  #shelfScreen{
    max-width:640px;
    margin:0 auto;
    padding:0 14px;
  }
  #shelfScreen.hidden{ display:none; }

  .hero-panel{
    background:linear-gradient(145deg,var(--orange-light) 0%,var(--orange) 100%);
    border-radius:28px;
    padding:30px 24px 28px;
    margin:20px 0 22px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-3d-dark);
  }
  .hero-panel::after{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:180px; height:180px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
  }
  .hero-eyebrow{
    color:rgba(255,255,255,0.85);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  .shelf-title{
    color:#FFFFFF;
    font-size:24px;
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .shelf-sub{
    color:rgba(255,255,255,0.88);
    font-size:13.5px;
    margin:0;
    line-height:1.5;
    max-width:420px;
  }

  .course-btn{
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card-bg);
    border:2px solid var(--orange-tint);
    border-radius:24px;
    padding:22px 24px;
    cursor:pointer;
    box-shadow:var(--shadow-3d);
    font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .course-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 rgba(232,90,12,0.18), 0 4px 10px rgba(232,90,12,0.10);
  }
  .course-btn-left{ display:flex; flex-direction:column; gap:4px; }
  .course-code{
    font-size:11px;
    font-weight:800;
    letter-spacing:.08em;
    color:var(--orange);
    text-transform:uppercase;
  }
  .course-name{
    font-size:17px;
    font-weight:800;
    color:var(--text-dark);
  }
  .course-meta{
    font-size:12px;
    color:var(--text-muted);
    margin-top:1px;
  }
  .course-arrow{
    color:#FFFFFF;
    font-size:20px;
    flex-shrink:0;
    background:linear-gradient(145deg,var(--orange-light),var(--orange));
    width:36px; height:36px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--orange-deep);
  }

  /* ---------- course screen ---------- */
  #courseScreen{ max-width:640px; margin:0 auto; padding:0 14px; }
  #courseScreen.hidden{ display:none; }

  .course-hero{
    background:linear-gradient(145deg,var(--orange-light) 0%,var(--orange) 100%);
    border-radius:28px;
    margin:18px 0 18px;
    padding:16px 24px 24px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-3d-dark);
  }
  .course-hero::after{
    content:"";
    position:absolute;
    right:-30px; bottom:-50px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.16);
  }
  .back-row{
    display:flex;
    align-items:center;
    gap:6px;
    color:rgba(255,255,255,0.85);
    font-size:12.5px;
    font-weight:700;
    padding:2px 0 14px;
    cursor:pointer;
    width:fit-content;
  }
  .back-row:hover{ color:#FFFFFF; }
  .course-hero-title{
    color:#FFFFFF;
    font-size:21px;
    font-weight:800;
    margin:0 0 3px;
    letter-spacing:-.01em;
  }
  .course-hero-sub{
    color:rgba(255,255,255,0.85);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    margin:0 0 16px;
    text-transform:uppercase;
  }
  .stats-strip{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat-pill{
    background:rgba(255,255,255,0.22);
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:16px;
    padding:10px 14px;
    flex:1;
    min-width:88px;
  }
  .stat-num{
    color:#FFFFFF;
    font-size:18px;
    font-weight:800;
    line-height:1.1;
  }
  .stat-label{
    color:rgba(255,255,255,0.85);
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin-top:2px;
  }

  .tabbar{
    background:var(--orange-tint);
    border-radius:20px;
    padding:6px;
    display:flex;
    gap:4px;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:nowrap;
    overflow-x:auto;
  }
  .tab-btn{
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    border:none;
    background:none;
    padding:11px 16px;
    border-radius:15px;
    cursor:pointer;
    color:var(--text-muted);
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab-btn.active{
    background:var(--orange);
    color:#FFFFFF;
    box-shadow:0 3px 0 var(--orange-deep);
  }

  .topic-list{ display:flex; flex-direction:column; gap:14px; }

  .topic{
    background:var(--card-bg);
    border-radius:22px;
    border:2px solid var(--orange-tint);
    box-shadow:var(--shadow-3d-sm);
    overflow:hidden;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .topic.open{
    border-color:var(--orange-light);
    box-shadow:0 6px 0 rgba(232,90,12,0.14), 0 12px 22px rgba(232,90,12,0.14);
  }
  .topic-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
  }
  .plus-icon{
    width:28px;height:28px;
    border-radius:11px;
    background:var(--orange-tint);
    color:var(--orange);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    transition:transform .2s ease, background .2s ease;
  }
  .plus-icon::before, .plus-icon::after{
    content:"";
    position:absolute;
    background:var(--orange);
    border-radius:2px;
  }
  .plus-icon::before{ width:12px; height:2px; }
  .plus-icon::after{ width:2px; height:12px; }
  .topic.open .plus-icon{
    transform:rotate(135deg);
    background:var(--orange);
  }
  .topic.open .plus-icon::before, .topic.open .plus-icon::after{ background:#FFFFFF; }

  .topic-name{
    flex:1;
    font-size:14.5px;
    font-weight:700;
    color:var(--text-dark);
  }
  .chevron{
    width:16px;height:16px;
    flex-shrink:0;
    color:var(--text-faint);
    transition:transform .2s ease;
  }
  .topic.open .chevron{ transform:rotate(180deg); color:var(--orange); }

  .topic-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .lecture-list{
    list-style:none;
    margin:0;
    padding:0 20px 18px 20px;
  }
  .lecture-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-top:1.5px solid var(--sub-line);
    font-size:13.5px;
  }
  .lecture-list li.clickable{
    cursor:pointer;
    transition:background 0.15s ease, transform .1s ease;
    margin:0 -12px;
    padding:11px 12px;
    border-radius:14px;
  }
  .lecture-list li:not(.clickable){ margin:0; }
  .lecture-list li.clickable:hover{
    background:var(--orange-tint);
  }
  .lecture-list li.clickable:active{
    background:var(--orange-tint);
    transform:scale(0.98);
  }
  .lecture-icon{
    flex-shrink:0;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    border-radius:11px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .lecture-icon svg{ width:20px; height:20px; display:block; }
  .lecture-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .lecture-title{
    color:var(--text-dark);
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lecture-dur{ color:var(--text-muted); font-size:11.5px; }
  .lecture-sub{ color:var(--orange); font-size:11px; font-weight:700; letter-spacing:.02em; }

  .empty-tab{
    padding:46px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
    background:var(--card-bg);
    border-radius:22px;
    border:2px solid var(--orange-tint);
    box-shadow:var(--shadow-3d-sm);
  }

  .site-footer{
    max-width:640px;
    margin:30px auto 0;
    padding:0 14px;
  }
  .footer-inner{
    background:linear-gradient(145deg,var(--orange-light) 0%,var(--orange) 100%);
    border-radius:24px;
    padding:22px 24px;
    text-align:center;
    box-shadow:var(--shadow-3d-dark);
  }
  .good-luck{
    font-size:13.5px;
    font-weight:700;
    color:#FFFFFF;
    margin:0;
    letter-spacing:.02em;
  }
  .footer-tagline{
    font-size:11px;
    color:rgba(255,255,255,0.8);
    margin:5px 0 0;
  }
</style>
</head>
<body>

  <!-- ============ SCREEN 1: COURSE PICKER ============ -->

      <p class="shelf-title">Your courses</p>
      <p class="shelf-sub">Structured lecture library, downloadable resources and mock exams — all in one place.</p>
    </div>
    <div id="courseList" class="topic-list"></div>
  </div>

  <!-- ============ SCREEN 2: COURSE DETAIL ============ -->
  <div id="courseScreen" class="hidden">
    <div class="course-hero">
      <div class="back-row" id="backLink">‹ All courses</div>

      <div class="stats-strip" id="statsStrip"></div>

    <div class="tabbar">
      <button class="tab-btn active" data-tab="lectures">Course Lectures</button>
      <button class="tab-btn" data-tab="attachments">Course Attachments</button>
      <button class="tab-btn" data-tab="sessions">Developmental sessions (not related to course)</button>
    </div>

    <div id="panel-lectures" class="topic-list"></div>

    <div id="panel-attachments" class="topic-list" style="display:none;"></div>

    <div id="panel-sessions" class="topic-list" style="display:none;">
      <div class="empty-tab">No developmental sessions have been posted yet.</div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="good-luck">Good luck with your studies</p>
      <p class="footer-tagline">Course Portal</p>
    </div>
  </footer>

  function renderTopicList(panel, dataArr) {
    dataArr.forEach((topic) => {
    const wrap = document.createElement('div');
    wrap.className = 'topic';
    wrap.innerHTML = `
      <button class="topic-head" aria-expanded="false">
        <span class="plus-icon"></span>
        <span class="topic-name">${topic.name}</span>
        <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topic-body">
        <ul class="lecture-list">
          ${topic.lectures.map(l => `
            <li ${l.url ? `class="clickable" data-url="${l.url}"` : ''}>
              <span class="lecture-icon">
                <svg viewBox="0 0 28 28" fill="none">
                  <circle cx="14" cy="14" r="13" fill="none" stroke="var(--play-red)" stroke-width="1.6"/>
                  <path d="M11.5 9.2v9.6l8-4.8-8-4.8z" fill="var(--play-red)"/>
                </svg>
              </span>
              <span class="lecture-info">
                <span class="lecture-title">${l.title}</span>
                ${l.dur ? `<span class="lecture-dur">${l.dur}</span>` : ''}
              </span>
            </li>`).join('')}
          ${(topic.materials || []).map(m => `
            <li ${m.url ? `class="clickable" data-url="${m.url}"` : ''}>
              <span class="lecture-icon">
                <svg viewBox="0 0 28 28" fill="none">
                  <path d="M7 3.5h10l4 4v17a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-20a1 1 0 0 1 1-1z" fill="var(--doc-blue)" opacity="0.14"/>
                  <path d="M7 3.5h10l4 4v17a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-20a1 1 0 0 1 1-1z" fill="none" stroke="var(--doc-blue)" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M17 3.5v4h4" fill="none" stroke="var(--doc-blue)" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M9.5 14h9M9.5 17.5h9M9.5 10.5h5" stroke="var(--doc-blue)" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="lecture-info">
                <span class="lecture-title">${m.title}</span>
                <span class="lecture-sub">Study Material</span>
              </span>
            </li>`).join('')}
        </ul>
      </div>
    `;
    const head = wrap.querySelector('.topic-head');
    const body = wrap.querySelector('.topic-body');
    head.addEventListener('click', () => {
      const isOpen = wrap.classList.toggle('open');
      head.setAttribute('aria-expanded', isOpen);
      body.style.maxHeight = isOpen ? body.scrollHeight + 'px' : 0;
    });

    // tapping a lecture/material row opens it in a new tab
    wrap.querySelectorAll('li[data-url]').forEach(li => {
      li.addEventListener('click', (e) => {
        e.stopPropagation();
        window.open(li.getAttribute('data-url'), '_blank');
      });
    });

    panel.appendChild(wrap);
    });
  }

  // ---- render the course list on the shelf screen ----
  const courseListEl = document.getElementById('courseList');
  courses.forEach((course, idx) => {
    let lectureCount = 0, resourceCount = 0;
    course.topics.forEach(t => {
      lectureCount += t.lectures.length;
      resourceCount += (t.materials || []).length;
    });
    const btn = document.createElement('button');
    btn.className = 'course-btn';
    btn.innerHTML = `
      <span class="course-btn-left">
        <span class="course-code">${course.code}</span>
        <span class="course-name">${course.name}</span>
        <span class="course-meta">${course.topics.length} Topics · ${lectureCount} Lectures</span>
      </span>
      <span class="course-arrow">›</span>
    `;
    btn.addEventListener('click', () => openCourse(idx));
    courseListEl.appendChild(btn);
  });

  // ---- screen navigation ----
  const shelfScreen = document.getElementById('shelfScreen');
  const courseScreen = document.getElementById('courseScreen');
  const backLink = document.getElementById('backLink');
  const panelLectures = document.getElementById('panel-lectures');
  const panelAttachments = document.getElementById('panel-attachments');

  function openCourse(idx){
    const course = courses[idx];

    // clear and re-render this course's lectures/attachments
    panelLectures.innerHTML = '';
    panelAttachments.innerHTML = '';
    renderTopicList(panelLectures, course.topics);
    renderTopicList(panelAttachments, course.attachments || []);

    // hero title/sub
    document.getElementById('courseHeroTitle').textContent = course.name;
    document.getElementById('courseHeroSub').textContent = course.tagline || '';

    // stats strip
    let lectureCount = 0, resourceCount = 0;
    course.topics.forEach(t => {
      lectureCount += t.lectures.length;
      resourceCount += (t.materials || []).length;
    });
    const stats = [
      { num: course.topics.length, label: 'Topics' },
      { num: lectureCount, label: 'Lectures' },
      { num: resourceCount, label: 'Resources' },
    ];
    document.getElementById('statsStrip').innerHTML = stats.map(s => `
      <div class="stat-pill">
        <div class="stat-num">${s.num}</div>
        <div class="stat-label">${s.label}</div>
      </div>`).join('');

    // reset to the "Course Lectures" tab each time a course is opened
    tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="lectures"]').classList.add('active');
    Object.entries(panels).forEach(([key, el]) => {
      el.style.display = key === 'lectures' ? 'flex' : 'none';
    });

    shelfScreen.classList.add('hidden');
    courseScreen.classList.remove('hidden');
    window.scrollTo(0,0);
  }

  backLink.addEventListener('click', () => {
    courseScreen.classList.add('hidden');
    shelfScreen.classList.remove('hidden');
    window.scrollTo(0,0);
  });

  // ---- tabs ----
  const tabButtons = document.querySelectorAll('.tab-btn');
  const panels = {
    lectures: panelLectures,
    attachments: panelAttachments,
    sessions: document.getElementById('panel-sessions'),
  };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(panels).forEach(([key, el]) => {
        el.style.display = key === btn.dataset.tab ? 'flex' : 'none';
      });
    });
  });
</script>
